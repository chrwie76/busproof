# The library's description — like package.json for one package of a workspace.
# This folder is what is published as `busproof`; everything else in the repository is not.

[project]
name = "busproof"
description = "A test language for asynchronous industrial interfaces: MQTT, REST, OPC UA."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Christoph Wielgus" }]
requires-python = ">=3.12"
keywords = ["testing", "mqtt", "asyncapi", "iiot", "packml", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/chrwie76/busproof"

[project.entry-points.pytest11]
# Gives every project with BusProof installed the fixtures `settings`, `contract` and `bus`.
busproof = "busproof.pytest_plugin"

[project.optional-dependencies]
mqtt = [
    "aiomqtt==2.5.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Only the library: its code, its licence and its own README.
include = ["/src", "/LICENSE", "/README.md"]

[tool.hatch.version]
# The version comes from the Git tag (v0.1.0); commits after it get a .devN suffix.
# The tags are on the repository, one folder up.
source = "vcs"
raw-options = { root = ".." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
# Tests may be `async def` without a decorator; each gets its own event loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
