# The test project for the demo packaging line — written as a customer would write one.

[project]
name = "test-project"
version = "0.1.0"
description = "Tests of the demo packaging line, written with BusProof."
requires-python = ">=3.12"
dependencies = ["busproof[mqtt]", "pytest>=9.2.0", "pytest-asyncio==1.4.1"]

[tool.uv]
# A test project is run, not installed: there is no package to build.
package = false

[tool.uv.sources]
# Until busproof is on PyPI, it comes from the folder next to this one, and a change there is
# seen here at once. Delete this line then — busproof comes from PyPI like for any customer.
busproof = { path = "../library", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["scenario(name): the plant starts from this file in plant/scenarios"]
