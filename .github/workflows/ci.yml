# Runs on every push and pull request: the same `make check` as on your machine.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: a new image is a deliberate change, not a surprise
    strategy:
      matrix:
        # The oldest Python we support and the one we develop on (.python-version).
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, so the version can be read from Git tags
      - uses: astral-sh/setup-uv@v10.3.2  # this action publishes exact tags only, no moving v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-packages --all-extras
      - run: make check

  plant:
    # The demo plant in Docker, on a real broker. Apart from `check`, which stays offline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-packages --all-extras
      - run: make fat
      - run: make line-tests
