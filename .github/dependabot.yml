# Opens a pull request when a CI action or a dependency has a new version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /test-project  # it has a lock file of its own
    schedule:
      interval: monthly
