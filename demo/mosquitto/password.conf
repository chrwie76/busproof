# The default profile: user and password, always over TLS, as a password without encryption
# protects nothing.
persistence false
log_dest stdout
allow_anonymous false
password_file /tmp/passwd

listener 8883
certfile /secrets/broker.crt
keyfile /secrets/broker.key

# For the web page: a browser can speak MQTT only over WebSockets, and would not trust this demo's
# own certificate authority. So this port is plain, and compose.yaml publishes it to this computer
# only. A real installation serves it with a proper certificate.
listener 9001
protocol websockets
