# The demo plant: a broker, three machines, the SCU that coordinates them, and a page to watch and
# use it. One image for all units. The ports on this computer can be changed in the environment.
name: busproof-demo

x-unit: &unit
  build: ./plant
  image: busproof-demo-plant
  restart: on-failure
  environment:
    PLANT_MQTT_URL: mqtt://mosquitto:1883
    PLANT_SCENARIO: ${PLANT_SCENARIO:-default}
  volumes:
    - ./contracts:/contracts:ro
    - ./plant/scenarios:/app/scenarios:ro
  depends_on:
    mosquitto:
      condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${BUSPROOF_MQTT_PORT:-1884}:1883"
      - "${BUSPROOF_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 2s
      retries: 10

  filler:
    <<: *unit
    command: filler

  capper:
    <<: *unit
    command: capper

  inspector:
    <<: *unit
    command: inspector

  scu:
    <<: *unit
    command: scu

  web:
    image: nginx:1.27-alpine
    ports:
      - "${BUSPROOF_WEB_PORT:-8088}:80"
    volumes:
      - ./plant/web:/usr/share/nginx/html:ro
      - ./contracts:/usr/share/nginx/html/contracts:ro
    depends_on:
      - mosquitto
