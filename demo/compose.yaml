# The demo plant: a broker, three machines and the SCU that coordinates them. One image for all
# units. The broker's port on this computer can be changed with BUSPROOF_MQTT_PORT.
name: busproof-demo

x-unit: &unit
  build: ./plant
  image: busproof-demo-plant
  environment:
    PLANT_MQTT_URL: mqtt://mosquitto:1883
  volumes:
    - ./contracts:/contracts:ro
  depends_on:
    mosquitto:
      condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${BUSPROOF_MQTT_PORT:-1884}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 2s
      retries: 10

  filler:
    <<: *unit
    command: filler

  capper:
    <<: *unit
    command: capper

  inspector:
    <<: *unit
    command: inspector

  scu:
    <<: *unit
    command: scu
