# The test project for the demo packaging line — written as a customer would write one.

[project]
name = "line-tests"
version = "0.1.0"
description = "Tests of the demo packaging line, written with BusProof."
requires-python = ">=3.12"
dependencies = ["busproof[mqtt]", "pytest>=9.2.0", "pytest-asyncio==1.4.0"]

[tool.uv]
# A test project is run, not installed: there is no package to build.
package = false

[tool.uv.sources]
# Inside this repository, busproof comes from the workspace. Delete this line when the project
# moves to a repository of its own — busproof then comes from PyPI like for any customer.
busproof = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
