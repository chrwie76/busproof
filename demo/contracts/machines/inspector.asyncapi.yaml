asyncapi: 3.0.0

info:
  title: Inspector
  version: 1.0.0
  description: |
    The inspection station at the end of a bottling line: measures how full each bottle is,
    passes the good ones and rejects the rest. It follows the PackML state machine in
    ../packml.yaml.

    Where it stands is not part of this contract: the four address parameters are filled by
    the line it is built into, so the same contract serves a test at the maker's (FAT) and in
    the plant (SAT). No `servers` either — which broker, is a matter of the environment.

channels:
  status:
    address: "{enterprise}/{site}/{area}/{line}/inspector"
    description: The machine's whole state, sent on every change and at least once a second.
    parameters:
      enterprise: {description: "ISA-95 enterprise, e.g. acme"}
      site: {description: "ISA-95 site, e.g. plant1"}
      area: {description: "ISA-95 area, e.g. packaging"}
      line: {description: "ISA-95 line, e.g. line1"}
    messages:
      status:
        $ref: "#/components/messages/status"
  command:
    address: "{enterprise}/{site}/{area}/{line}/inspector/cmd"
    description: A PackML command for the machine. One it does not accept in its state is ignored.
    parameters:
      enterprise: {description: "ISA-95 enterprise"}
      site: {description: "ISA-95 site"}
      area: {description: "ISA-95 area"}
      line: {description: "ISA-95 line"}
    messages:
      command:
        $ref: "#/components/messages/command"
  settings:
    address: "{enterprise}/{site}/{area}/{line}/inspector/set"
    description: New parameters for the machine. It reports the new values in its status.
    parameters:
      enterprise: {description: "ISA-95 enterprise"}
      site: {description: "ISA-95 site"}
      area: {description: "ISA-95 area"}
      line: {description: "ISA-95 line"}
    messages:
      settings:
        $ref: "#/components/messages/settings"
  online:
    address: "{enterprise}/{site}/{area}/{line}/inspector/online"
    description: |
      Retained. The machine sends true when it connects. Its MQTT last will sends false for it
      when it is gone, which tells "gone" from "has nothing to say".
    parameters:
      enterprise: {description: "ISA-95 enterprise"}
      site: {description: "ISA-95 site"}
      area: {description: "ISA-95 area"}
      line: {description: "ISA-95 line"}
    messages:
      online:
        $ref: "#/components/messages/online"

operations:
  reportStatus:
    action: send
    channel: {$ref: "#/channels/status"}
    summary: The inspector reports its state, its counters and its last measurement.
  takeCommand:
    action: receive
    channel: {$ref: "#/channels/command"}
    summary: The inspector takes a command.
  takeSettings:
    action: receive
    channel: {$ref: "#/channels/settings"}
    summary: The inspector takes new parameters.
  reportOnline:
    action: send
    channel: {$ref: "#/channels/online"}
    summary: The inspector says it is there; its last will says when it is gone.

components:
  messages:
    status:
      payload:
        type: object
        required: [state, pass_count, reject_count, last_fill_level, min_fill_level]
        properties:
          state:
            type: integer
            description: PackTags state number (../packml.yaml), e.g. 6 for Execute.
            enum: [1, 2, 3, 4, 6, 7, 8, 9, 10, 11, 12, 15]
          pass_count:
            type: integer
            minimum: 0
            description: Bottles passed since the last reset.
          reject_count:
            type: integer
            minimum: 0
            description: Bottles rejected since the last reset.
          last_fill_level:
            type: number
            minimum: 0
            maximum: 100
            description: The fill level measured on the last bottle, in percent of its nominal volume.
          min_fill_level:
            type: number
            minimum: 0
            maximum: 100
            description: A bottle below this fill level is rejected, in percent.
      examples:
        - name: running
          payload: {state: 6, pass_count: 1201, reject_count: 9, last_fill_level: 97.8, min_fill_level: 90.0}
    command:
      payload:
        type: object
        required: [command]
        properties:
          command:
            type: string
            enum: [Reset, Start, Stop, Hold, Unhold, Abort, Clear]
      examples:
        - name: start
          payload: {command: Start}
    settings:
      payload:
        type: object
        minProperties: 1
        additionalProperties: false
        properties:
          min_fill_level:
            type: number
            minimum: 0
            maximum: 100
      examples:
        - name: change
          payload: {min_fill_level: 90.0}
    online:
      payload:
        type: object
        required: [online]
        properties:
          online:
            type: boolean
      examples:
        - name: there
          payload: {online: true}
