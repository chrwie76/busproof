# The demo line: which machines make it, in which order, and where it stands.
#
# Mounted into the service of every machine, and read by the tests: so the plant publishes
# under the address the tests listen to, from one file. On a real line this is what an
# integrator sets at commissioning, written down.

name: line1

# Fills {enterprise}/{site}/{area}/{line} in the topics of every machine contract (ISA-95).
address:
  enterprise: acme
  site: plant1
  area: packaging
  line: line1

# In the order a bottle passes them. Each names its contract and the state machine it follows.
machines:
  filler: {contract: machines/filler.asyncapi.yaml, states: packml.yaml}
  capper: {contract: machines/capper.asyncapi.yaml, states: packml.yaml}
  inspector: {contract: machines/inspector.asyncapi.yaml, states: packml.yaml}

# How long a bottle travels to each station. It starts at the first machine; the last one's verdict
# is its end. The belt runs in Execute and while the line runs empty, and stands still otherwise.
transport:
  - {to: capper, seconds: 3}
  - {to: inspector, seconds: 2}

# The unit that coordinates the machines. Machines also take commands directly, so one can be
# tested without it. What it should do is written here, so a test can check that it does.
controller:
  name: scu
  contract: scu.asyncapi.yaml
  states: packml.yaml
  start_order: [inspector, capper, filler]  # from the end of the line, so nothing jams
  stop_order: [filler, capper, inspector]  # from its beginning, so the line runs empty
  on_machine_fault: Hold  # when a machine fails or is gone, the rest of the line holds
