# The repository's root: a workspace of three projects and the settings they share.
# Each project is described by a pyproject.toml of its own; exact versions live in uv.lock.

[tool.uv.workspace]
# Several projects in one repository, sharing one .venv and one uv.lock (like npm workspaces):
# the library that is published, the plant that is tested, and the test project that tests it.
members = ["library", "plant", "test-project"]

[dependency-groups]
# Tools for working on BusProof itself; never installed for users.
dev = [
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio==1.4.1",  # 1.4.1 was days old when added; Dependabot proposes it later
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
# From the root, pytest runs the checks on the repository itself. Each project has its own tests.
testpaths = ["tests"]
# tools/ holds repository helpers (not part of the package) that have tests of their own.
pythonpath = ["tools"]
addopts = ["--strict-markers", "--import-mode=importlib"]
# The library's pytest plugin is installed here too, and its fixtures are asynchronous.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["library/src", "tools", "test-project", "plant/src"]  # where our own imports live, for sorting them apart from third-party ones

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["library", "tests", "tools", "test-project", "plant"]
extraPaths = ["tools", "test-project", "plant/src"]
typeCheckingMode = "standard"
